services:
  - type: web
    name: jansamadhan-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: AI_SERVICE_URL
        value: http://127.0.0.1:8001
      - key: PUBLIC_ORIGINS
        sync: false
